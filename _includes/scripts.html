<!-- Visitor IP Logging via Cloudflare Workers -->
<script>
(function() {
  // 保持现有 Worker 的 GET 参数协议；IP 和访问时间由服务端记录。
  var WORKER_URL = 'https://log.lezheng.org';
  var hostname = window.location.hostname;
  if (hostname !== 'lezheng.org' && hostname !== 'www.lezheng.org') return;
  if (typeof fetch !== 'function' || window.__lezhengVisitRequested) return;

  // 仅防止当前文档重复加载脚本；翻页、刷新后仍会记录，不依赖浏览器存储。
  window.__lezhengVisitRequested = true;

  // 不发送查询参数和片段，避免将 URL 中的私人信息写入日志。
  var page = window.location.origin + window.location.pathname;
  var ua = navigator.userAgent;
  var requestId = Date.now().toString(36) + Math.random().toString(36).slice(2);

  fetch(WORKER_URL + '?page=' + encodeURIComponent(page) + '&ua=' + encodeURIComponent(ua) + '&request_id=' + requestId, {
    method: 'GET',
    mode: 'cors',
    credentials: 'omit',
    cache: 'no-store',
    keepalive: true,
    referrerPolicy: 'strict-origin-when-cross-origin'
  }).then(function(response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  }).then(function(result) {
    if (!result || result.status !== 'ok') throw new Error('Worker did not acknowledge the visit');
  }).catch(function() {
    // 不输出服务端返回的 IP，也不将失败标记写入 sessionStorage。
    console.warn('Visitor logging was not confirmed. Check the log.lezheng.org request in the Network panel.');
  });
})();
</script>
